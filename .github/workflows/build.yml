name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # A check that it builds; the APK to install comes from Releases (no artifact: storage is limited).
      - name: Build the debug APKs (github and play)
        run: ./gradlew assembleGithubDebug assemblePlayDebug
      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest
