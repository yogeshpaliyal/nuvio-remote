name: Release

# Push a tag like v1.2.0: builds the APK (GitHub) and the app bundle (.aab, for Google Play), both signed with the
# release key (repo secrets, the same key Play signs with), and publishes them as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK and app bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "skiff-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "skiff-${VERSION_NAME}.aab"
      - name: Check the signatures
        run: |
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs skiff-*.apk | head -3
          jarsigner -verify skiff-*.aab | grep 'jar verified'     # fails the job when the bundle isn't signed
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            skiff-*.apk
            skiff-*.aab
          generate_release_notes: true
