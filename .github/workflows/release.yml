name: Release

# Push a tag like v1.2.0: builds the APK signed with the release key (repo secrets) and publishes it as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="${VERSION_NAME#v}"
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "nuvio-remote-${VERSION_NAME}.apk"
      - name: Check the signature
        run: |
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs nuvio-remote-*.apk | head -3
      - uses: softprops/action-gh-release@v2
        with:
          files: nuvio-remote-*.apk
          generate_release_notes: true
