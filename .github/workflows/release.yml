name: Release

# Actions → Release → Run workflow, picking patch, minor or major:
#  1. raises the version in version.properties (1.8.0 → 1.8.1, 1.9.0 or 2.0.0; versionCode + 1);
#  2. builds the APK (GitHub) and the app bundle (.aab, Google Play), signed with the release key (repo secrets);
#  3. only if that works: commits version.properties to main;
#  4. tags that commit (v1.9.0) and publishes the release with both files.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise"
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# One release at a time: two at once would both raise the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Raise the version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2)
          code=$(grep '^versionCode=' version.properties | cut -d= -f2)
          IFS=. read -r major minor patch <<< "$name"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            *)     patch=$((patch + 1)) ;;
          esac
          next="$major.$minor.$patch"
          nextCode=$((code + 1))
          if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
            echo "::error::v$next is already tagged: version.properties is behind the tags"
            exit 1
          fi
          sed -i "s/^versionName=.*/versionName=$next/; s/^versionCode=.*/versionCode=$nextCode/" version.properties
          echo "Releasing $name → $next (versionCode $code → $nextCode)"
          echo "name=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK and app bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "skiff-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "skiff-${VERSION_NAME}.aab"

      - name: Check the signatures
        run: |
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs skiff-*.apk | head -3
          jarsigner -verify skiff-*.aab | grep 'jar verified'     # fails the job when the bundle isn't signed

      # Only after a good build: the new version goes to main, tagged.
      - name: Commit the version to main and tag it
        env:
          NAME: ${{ steps.version.outputs.name }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "Release $NAME"
          # main may have moved while this built: put the version commit on top of it.
          git pull --rebase origin main
          git push origin HEAD:main
          git tag -a "$TAG" -m "Skiff $NAME"
          git push origin "$TAG"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Skiff ${{ steps.version.outputs.name }}
          files: |
            skiff-*.apk
            skiff-*.aab
          generate_release_notes: true
