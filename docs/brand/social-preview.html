<!doctype html>
<!-- GitHub's social preview (1280×640): the banner, scaled to the width (its empty top and bottom edges cropped). Render: --window-size=1280,640 -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #100D18; }
  iframe { border: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
    transform: translate(0, -40px) scale(0.6667); }
</style></head>
<body><iframe src="banner.html" scrolling="no"></iframe></body></html>
