<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <title>Skiff — Send to TV</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A3DF0"/>
      <stop offset="1" stop-color="#0FB8A9"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>
  <!-- The mark: a skiff whose sail is a play button. The app icon draws it at 0.72 (launcher masks). -->
  <g transform="translate(54 54) scale(1.0) translate(-54 -54)">
    <path d="M50 27.5 L50 61.5 L75 48.5 Z" fill="#FFCB47" stroke="#FFCB47" stroke-width="4" stroke-linejoin="round"/>
    <path d="M29 67.5 H79 L70 80.5 H38 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
  </g>
</svg>
